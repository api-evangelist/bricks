aid: bricks
name: BRICKS
description: >-
  BRICKS is a no-code Platform-as-a-Service from BRICKS DAG, Inc. (Taipei,
  Taiwan) for building and managing interactive digital signage, kiosks, and
  multi-display stitched screens. A WYSIWYG editor lets designers and businesses
  create dynamic, data-driven displays — menu boards, wayfinding and crowd
  control, meeting-room panels, sports scoreboards, promotional posters, and NFT
  frames — deploy them to app-bound devices, control them remotely from mobile,
  and connect live data sources and APIs, all without writing code. BRICKS is a
  500 Global Accelerator Taiwan (TTA 2022) company.
